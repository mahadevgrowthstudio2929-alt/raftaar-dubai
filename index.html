<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAFTAR DUBAI | Cricket Analysis</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
font-family:'Inter',sans-serif;
background:#050505;
display:flex;
justify-content:center;
align-items:center;
position:relative;
color:white;
}

/* Animated Background */

.bg{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:-2;
}

.bg span{
position:absolute;
display:block;
width:300px;
height:300px;
background:rgba(255,215,0,.09);
filter:blur(120px);
animation:float 10s infinite alternate ease-in-out;
}

.bg span:nth-child(1){
top:-100px;
left:-50px;
}

.bg span:nth-child(2){
bottom:-100px;
right:-50px;
animation-duration:12s;
}

@keyframes float{
from{transform:translateY(-30px);}
to{transform:translateY(40px);}
}

/* Main Card */

.card{
width:92%;
max-width:420px;
padding:22px;
border-radius:28px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,215,0,.16);
box-shadow:
0 0 40px rgba(255,215,0,.15),
0 0 100px rgba(255,215,0,.05);
text-align:center;
animation:fadeUp 1s ease;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* Logo */

.logo{
width:78px;
height:78px;
border-radius:50%;
object-fit:cover;
border:2px solid #FFD700;
box-shadow:0 0 20px rgba(255,215,0,.5);
margin-bottom:14px;
}

/* Branding */

h1{
font-family:'Orbitron',sans-serif;
font-size:27px;
font-weight:900;
line-height:1.2;
letter-spacing:1px;
color:#FFD700;
text-shadow:0 0 15px rgba(255,215,0,.3);
}

.subtitle{
font-size:12px;
color:#cfcfcf;
margin-top:7px;
margin-bottom:20px;
}

/* Highlights */

.stats{
display:flex;
justify-content:space-between;
margin-bottom:22px;
padding:14px 5px;
border-top:1px solid rgba(255,215,0,.15);
border-bottom:1px solid rgba(255,215,0,.15);
}

.stat{
flex:1;
}

.number{
font-size:17px;
font-weight:800;
color:#FFD700;
}

.label{
font-size:10px;
color:#bfbfbf;
margin-top:4px;
}

/* Features */

.bar-wrap{
margin-bottom:14px;
text-align:left;
}

.bar-title{
font-size:12px;
margin-bottom:7px;
display:flex;
justify-content:space-between;
color:#eeeeee;
}

.bar-title span:last-child{
color:#FFD700;
font-weight:700;
}

.bar{
height:7px;
background:rgba(255,255,255,.08);
border-radius:50px;
overflow:hidden;
}

.fill{
height:100%;
border-radius:50px;
background:linear-gradient(90deg,#FFD700,#ffef9f);
animation:load 2s ease forwards;
}

.fill1{width:95%;}
.fill2{width:90%;}
.fill3{width:98%;}

@keyframes load{
from{width:0;}
}

/* Join Button */

.cta{
display:block;
width:100%;
margin-top:20px;
padding:16px;
border:none;
text-decoration:none;
font-weight:800;
font-size:14px;
color:#000;
border-radius:18px;
background:linear-gradient(135deg,#FFD700,#FFF2A6);
box-shadow:0 0 25px rgba(255,215,0,.5);
transition:.3s;
animation:pulse 2s infinite;
cursor:pointer;
}

.cta:hover{
transform:scale(1.03);
}

@keyframes pulse{
0%{box-shadow:0 0 10px rgba(255,215,0,.4);}
50%{box-shadow:0 0 30px rgba(255,215,0,.8);}
100%{box-shadow:0 0 10px rgba(255,215,0,.4);}
}

.note{
margin-top:14px;
font-size:11px;
color:#bfbfbf;
line-height:1.6;
}

/* Footer */

.brand{
position:absolute;
bottom:10px;
width:100%;
text-align:center;
font-size:11px;
color:#8a8a8a;
}

.brand span{
color:#FFD700;
font-weight:700;
}
</style>
</head>

<body>

<div class="bg">
<span></span>
<span></span>
</div>

<div class="card">

<img src="logo.png" class="logo" alt="Raftar Dubai Logo">

<h1>RAFTAR DUBAI</h1>

<div class="subtitle">
Premium Cricket Analysis & Match Insights
</div>

<div class="stats">

<div class="stat">
<div class="number">CRICKET</div>
<div class="label">Main Focus</div>
</div>

<div class="stat">
<div class="number">LIVE</div>
<div class="label">Match Updates</div>
</div>

<div class="stat">
<div class="number">PRO</div>
<div class="label">Analysis</div>
</div>

</div>

<div class="bar-wrap">
<div class="bar-title">
<span>Pre-Match Analysis</span>
<span>●</span>
</div>
<div class="bar">
<div class="fill fill1"></div>
</div>
</div>

<div class="bar-wrap">
<div class="bar-title">
<span>Match Insights</span>
<span>●</span>
</div>
<div class="bar">
<div class="fill fill2"></div>
</div>
</div>

<div class="bar-wrap">
<div class="bar-title">
<span>Cricket Updates</span>
<span>●</span>
</div>
<div class="bar">
<div class="fill fill3"></div>
</div>
</div>

<button type="button" class="cta"
onclick="window.open('https://t.me/+rtEqk5RCg1owYmE1','_blank')">
🏏 JOIN RAFTAR DUBAI NOW
</button>

<div class="note">
⚡ Cricket Insights • Match Analysis • Regular Updates
</div>

</div>

<div class="brand">
Ads Managed by <span>Mahadev Growth Studio</span>
</div>

</body>
</html>
